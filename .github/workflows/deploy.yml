name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets a future workflow (e.g. Phase 6's scheduled projection update)
  # redeploy explicitly. A commit authored by a workflow's own GITHUB_TOKEN
  # does NOT re-trigger `on: push`, so that path alone would never fire this.
  workflow_call:

permissions:
  contents: read

# One deployment at a time; never abort a deploy that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # matches engines >=22.12 and the local dev machine
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/configure-pages@v5

      - name: Install (locked, reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the production build
        run: |
          grep -q '"/Fantasy-Football-Draft-Tool/assets/' dist/index.html \
            || { echo "::error::dist/index.html is missing the Pages base path -- check vite.config.ts base"; exit 1; }
          test -s dist/data/projections.json \
            || { echo "::error::dist/data/projections.json missing or empty -- sync-data did not run"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          # actions' `with:` inputs ignore `defaults.run.working-directory`,
          # so this must be the full path from the repo root.
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
